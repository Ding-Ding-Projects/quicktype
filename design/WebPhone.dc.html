<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>quicktype Studio on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B2FE0}a:hover{color:#3420B0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F3EC; color: #1C1B1F; font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif; font-size: 15px; overflow: hidden">
<header style="display: flex; align-items: center; gap: 10px; padding: 48px 16px 12px">
<svg width="28" height="28" viewBox="0 0 32 32" role="img" aria-label="quicktype Studio logo"><rect width="32" height="32" rx="10" fill="#4B2FE0"></rect><path d="M11 9c-3 0-3 2-3 4s-1 3-2 3c1 0 2 1 2 3s0 4 3 4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><path d="M16 11h10M21 11v12" fill="none" stroke="#FFB38A" stroke-width="2.6" stroke-linecap="round"></path></svg>
<span style="flex: 1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 18px">quicktype Studio</span>
<button aria-label="Search everything" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D4CBBB; background: #FFFFFF; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#3D3842" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</header>
<div role="tablist" aria-label="Panes" style="display: flex; gap: 4px; margin: 0 16px; padding: 4px; border-radius: 24px; background: #E8E1D4">
<button role="tab" aria-selected="false" style="flex: 1; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #3D3842">Source</button>
<button role="tab" aria-selected="true" style="flex: 1; height: 40px; border-radius: 20px; border: 0; background: #FFFFFF; font-weight: 700">Code</button>
<button role="tab" aria-selected="false" style="flex: 1; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #3D3842">Options</button>
</div>
<div style="display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto">
<button style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #4B2FE0; color: #FFFFFF; font-weight: 700">Swift</button>
<button style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D4CBBB; background: #FFFFFF">Kotlin</button>
<button style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D4CBBB; background: #FFFFFF">TypeScript</button>
<button style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D4CBBB; background: #FFFFFF">Dart</button>
</div>
<pre style="flex: 1; margin: 0 16px; padding: 16px; border-radius: 24px; background: #17161C; color: #EDEAF2; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.65; overflow: auto; white-space: pre">struct Order: Codable {
    let order: Int
    let paid: Bool
    let items: [Item]
}

struct Item: Codable {
    let sku: String
    let qty: Int
    let price: Double
}</pre>
<div style="display: flex; gap: 10px; padding: 14px 16px 28px">
<button style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #B8AE9C; background: transparent">Share</button>
<button style="flex: 2; height: 52px; border-radius: 26px; border: 0; background: #FFB38A; color: #2A1306; font-weight: 700">Copy code</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
