<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicktype Appliance status</title>
<style>
body{margin:0;background:#17161c;color:#edeaf2;font:16px/1.5 "Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font:800 2.2rem/1.1 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.card{padding:20px;border-radius:28px;background:#23212c;display:flex;flex-direction:column;gap:8px}
.card.main{background:#4b2fe0}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.big{font:800 1.7rem "Bricolage Grotesque",system-ui,sans-serif}
a.btn{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:22px;background:#fff;color:#4b2fe0;font-weight:700;text-decoration:none}
code{font-family:"JetBrains Mono",ui-monospace,monospace}
</style>
</head>
<body>
<main>
<h1>Appliance status</h1>
<div class="grid">
<section class="card main"><span class="eyebrow">Studio service</span><span class="big" id="state">Checking</span><span id="uptime"></span><a class="btn" href="./">Open Studio</a></section>
<section class="card"><span class="eyebrow">Network</span><div id="addresses"></div><span>Reachable from your local network. Nothing is exposed to the internet by this appliance.</span></section>
<section class="card"><span class="eyebrow">Updates</span><span>The system image and the Studio container are updated together by flashing or importing the next appliance release.</span></section>
</div>
</main>
<script>
fetch("api/status").then(r => r.json()).then(s => {
  document.getElementById("state").textContent = "Running";
  document.getElementById("uptime").textContent = "Up for " + Math.round(s.uptimeSeconds / 60) + " minutes on " + s.host;
  const box = document.getElementById("addresses");
  for (const a of s.addresses) { const c = document.createElement("code"); c.textContent = a; box.append(c, document.createElement("br")); }
}).catch(e => { document.getElementById("state").textContent = "Not answering: " + e.message; });
</script>
</body>
</html>
